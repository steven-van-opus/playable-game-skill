<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131120">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Mothlight</title>
<style>
  * { box-sizing: border-box }
  :root { color-scheme: dark }
  body {
    margin: 0; background: radial-gradient(ellipse at 72% 52%, #241b38, #131120 69%);
    color: #fff3dd; font: 17px/1.5 system-ui, sans-serif;
  }
  main {
    display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 440px);
    gap: clamp(32px, 7vw, 112px); align-items: center; justify-content: center;
    min-height: 100svh; max-width: 1120px; margin: auto; padding: 40px;
  }
  h1 {
    margin: 0; color: #ffdf97; font: normal clamp(68px, 8vw, 116px)/.85 Georgia, serif;
    letter-spacing: -.075em;
  }
  .intro { max-width: 27ch; margin: 22px 0 28px; color: #d2c5df; font-size: 18px }
  .legend { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 0 0 28px; color: #f1e5f8; font-size: 14px }
  .legend span { display: inline-flex; gap: 9px; align-items: center }
  .legend i { display: inline-block; width: 12px; height: 12px }
  .lantern { border-radius: 4px; background: #ffcd71; box-shadow: 0 0 14px #ff9f5480 }
  .thorn { border-radius: 1px; background: #b199f9; transform: rotate(45deg) }
  button { min-height: 44px; border: 0; border-radius: 9px; font: 700 15px system-ui; cursor: pointer }
  button:focus-visible { outline: 3px solid #f3e8fd; outline-offset: 3px }
  #start { color: #281d14; background: #ffd17a; padding: 0 21px }
  #status { min-height: 1.5em; margin: 11px 0 0; color: #d2c5df; font-size: 14px }
  .game { min-width: 0 }
  .scorebar { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 9px; color: #d2c5df; font-size: 14px }
  #score { color: #ffdf97; font-weight: 800; font-variant-numeric: tabular-nums }
  canvas {
    display: block; width: 100%; height: auto; border-radius: 18px;
    outline: 1px solid #57476a; touch-action: none; box-shadow: 0 20px 60px #08061183;
  }
  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px }
  .lanes button { background: #2a223d; color: #e6def5; border: 1px solid #57476a }
  .lanes button[aria-pressed="true"] { color: #ffdf97; background: #47334c; border-color: #a17b62 }
  @media (max-width: 690px) {
    main { grid-template-columns: minmax(0, 380px); gap: 24px; min-height: auto; padding: 26px 20px }
    h1 { font-size: clamp(55px, 13vw, 78px) }
    .intro { margin: 9px 0 12px; font-size: 15px }
    .legend { margin-bottom: 12px }
    #status { display: inline-block; margin: 0 0 0 10px }
  }
</style>
<main>
  <section aria-labelledby="title">
    <h1 id="title">Mothlight</h1>
    <p class="intro">Collect lanterns in the moon garden. Change lanes before the thorns reach you.</p>
    <p class="legend"><span><i class="lantern" aria-hidden="true"></i> Collect</span><span><i class="thorn" aria-hidden="true"></i> Dodge</span></p>
    <button id="start" type="button">Start game</button>
    <p id="status" aria-live="polite">Ready to fly</p>
  </section>
  <section class="game" aria-label="Mothlight game">
    <div class="scorebar"><span>Tap a lane or use ← →</span><span>Lanterns <output id="score">0</output></span></div>
    <canvas id="game" width="440" height="560" aria-label="Three-lane moon garden"></canvas>
    <div class="lanes" aria-label="Choose a lane">
      <button id="left" type="button" aria-pressed="false">1 · Left</button>
      <button id="center" type="button" aria-pressed="true">2 · Center</button>
      <button id="right" type="button" aria-pressed="false">3 · Right</button>
    </div>
  </section>
</main>
<script>
  const canvas = document.getElementById('game');
  const context = canvas.getContext('2d');
  const scoreLabel = document.getElementById('score');
  const statusLabel = document.getElementById('status');
  const startButton = document.getElementById('start');
  const laneButtons = ['left', 'center', 'right'].map((id) => document.getElementById(id));
  const laneX = [86, 220, 354];
  const mothY = 478;
  const rows = [];
  let lane = 1;
  let mothX = laneX[lane];
  let score = 0;
  let nextRow = 0;
  let rowNumber = 0;
  let state = 'ready';
  let lastFrame;

  function chooseLane(nextLane) {
    lane = Math.min(laneX.length - 1, Math.max(0, nextLane));
    laneButtons.forEach((button, index) => button.setAttribute('aria-pressed', String(index === lane)));
  }

  function startGame() {
    rows.length = 0;
    rowNumber = 0;
    nextRow = 0.18;
    score = 0;
    scoreLabel.textContent = '0';
    chooseLane(1);
    mothX = laneX[lane];
    state = 'playing';
    statusLabel.textContent = 'In flight';
    startButton.textContent = 'Restart game';
  }

  startButton.addEventListener('click', startGame);
  laneButtons.forEach((button, index) => button.addEventListener('click', () => chooseLane(index)));
  window.addEventListener('keydown', (event) => {
    const nextLane = { ArrowLeft: lane - 1, ArrowRight: lane + 1, 1: 0, 2: 1, 3: 2 }[event.key];
    if (typeof nextLane !== 'number') return;
    event.preventDefault();
    if (!event.repeat) chooseLane(nextLane);
  });
  canvas.addEventListener('pointerdown', (event) => {
    const bounds = canvas.getBoundingClientRect();
    chooseLane(Math.floor((event.clientX - bounds.left) / bounds.width * laneX.length));
  });

  function newRow() {
    // The first lantern flies straight toward the moth.
    const thorn = rowNumber === 0 ? 2 : Math.floor(Math.random() * laneX.length);
    const lantern = rowNumber === 0 ? 1 : (thorn + 1 + Math.floor(Math.random() * 2)) % laneX.length;
    rowNumber += 1;
    return { thorn, lantern, y: -18, passed: false, collected: false };
  }

  function update(seconds) {
    mothX += (laneX[lane] - mothX) * Math.min(1, seconds * 20);
    if (state !== 'playing') return;

    nextRow -= seconds;
    if (nextRow <= 0) {
      rows.push(newRow());
      nextRow += Math.max(0.8, 1.3 - score * 0.035);
    }

    const speed = 188 + Math.min(148, score * 12);
    for (const row of rows) {
      row.y += speed * seconds;
      if (row.passed || row.y < mothY - 13) continue;
      row.passed = true;

      if (row.thorn === lane) {
        state = 'over';
        statusLabel.textContent = 'Caught a thorn.';
        startButton.textContent = 'Play again';
        return;
      }
      if (row.lantern === lane) {
        row.collected = true;
        score += 1;
        scoreLabel.textContent = String(score);
      }
    }
    if (rows.length && rows[0].y > canvas.height + 24) rows.shift();
  }

  function circle(x, y, radius, color) {
    context.fillStyle = color;
    context.beginPath();
    context.arc(x, y, radius, 0, Math.PI * 2);
    context.fill();
  }

  function drawGarden(now) {
    const dusk = context.createLinearGradient(0, 0, 0, canvas.height);
    dusk.addColorStop(0, '#191629');
    dusk.addColorStop(1, '#3d2748');
    context.fillStyle = dusk;
    context.fillRect(0, 0, canvas.width, canvas.height);

    const glow = context.createRadialGradient(221, 151, 0, 221, 151, 176);
    glow.addColorStop(0, '#fcb87840');
    glow.addColorStop(1, '#fcb87800');
    context.fillStyle = glow;
    context.fillRect(0, 0, canvas.width, 350);
    circle(221, 151, 51, '#eeb579');
    circle(226, 139, 39, '#f6c790');
    circle(238, 163, 9, '#df9d6a');
    circle(201, 137, 5, '#e0a377');
    circle(214, 177, 11, '#e4a475');

    for (let i = 0; i < 63; i += 1) {
      const x = (i * 73 + 19) % canvas.width;
      const y = (i * 43 + 8) % canvas.height;
      const alpha = 0.22 + 0.12 * Math.sin(i + now / 500);
      circle(x, y, i % 11 === 0 ? 2 : 1, 'rgba(255, 223, 178, ' + alpha + ')');
    }

    context.fillStyle = '#ffe8c109';
    context.fillRect(laneX[lane] - 54, 0, 108, canvas.height);
    context.strokeStyle = '#d5b0e431';
    context.setLineDash([3, 11]);
    context.beginPath();
    for (const x of [153, 287]) {
      context.moveTo(x, 17);
      context.lineTo(x, canvas.height - 17);
    }
    context.stroke();
    context.setLineDash([]);
    context.fillStyle = '#a371b145';
    context.fillRect(24, mothY + 23, canvas.width - 48, 1);

    // Most foreground stems stay near the edges so hazards remain readable.
    context.strokeStyle = '#22152f';
    context.lineWidth = 3;
    for (let i = 0; i < 20; i += 1) {
      const x = (i % 2 ? canvas.width - 8 : 8) + ((i * 13) % 37) - 18;
      const height = 32 + (i * 23) % 72;
      context.beginPath();
      context.moveTo(x, canvas.height);
      context.quadraticCurveTo(x + 2, canvas.height - height / 2, x + (i % 2 ? -12 : 12), canvas.height - height);
      context.stroke();
    }
  }

  function drawLantern(x, y) {
    circle(x, y, 21, '#ffac6330');
    circle(x, y, 14, '#ffcc6460');
    context.fillStyle = '#ffc675';
    context.beginPath();
    context.roundRect(x - 8, y - 10, 16, 20, 5);
    context.fill();
    context.fillStyle = '#fff0ba';
    context.fillRect(x - 3, y - 6, 6, 11);
    context.fillStyle = '#f38a66';
    context.fillRect(x - 5, y - 13, 10, 3);
  }

  function drawThorn(x, y) {
    context.fillStyle = '#9d79df';
    context.beginPath();
    context.moveTo(x, y - 16);
    context.lineTo(x + 18, y + 4);
    context.lineTo(x + 8, y + 5);
    context.lineTo(x, y + 16);
    context.lineTo(x - 8, y + 5);
    context.lineTo(x - 18, y + 4);
    context.closePath();
    context.fill();
    circle(x, y, 3, '#e9d6ff');
  }

  function drawMoth(now) {
    const span = 16 + 6 * Math.sin(now / 70);
    circle(mothX, mothY, 31, '#ffd18c16');
    context.fillStyle = '#ffbc90';
    for (const direction of [-1, 1]) {
      context.beginPath();
      context.moveTo(mothX, mothY + 4);
      context.quadraticCurveTo(mothX + direction * (span + 12), mothY - 28, mothX + direction * (span + 10), mothY - 5);
      context.quadraticCurveTo(mothX + direction * (span + 5), mothY + 18, mothX, mothY + 4);
      context.fill();
      circle(mothX + direction * (span - 1), mothY - 1, 3, '#fff1bb');
      context.fillStyle = '#ffbc90';
    }
    context.fillStyle = '#fff0ba';
    context.beginPath();
    context.ellipse(mothX, mothY + 1, 4, 11, 0, 0, Math.PI * 2);
    context.fill();
    context.strokeStyle = '#fff0ba';
    context.lineWidth = 1.5;
    context.beginPath();
    context.moveTo(mothX - 7, mothY - 17);
    context.lineTo(mothX, mothY - 8);
    context.lineTo(mothX + 7, mothY - 17);
    context.stroke();
  }

  function frame(now) {
    const seconds = lastFrame === undefined ? 0 : Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    update(seconds);
    drawGarden(now);
    for (const row of rows) {
      if (!row.collected) drawLantern(laneX[row.lantern], row.y);
      drawThorn(laneX[row.thorn], row.y);
    }
    drawMoth(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</html>
